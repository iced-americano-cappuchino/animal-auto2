name: 유기동물 데이터 자동 수집
on:
  schedule:
    # UTC 15:01 = KST 00:01 (다음날)
    - cron: "1 15 * * *"
  workflow_dispatch: {}

jobs:
  scrape-and-visualize:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Python 설치
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 한글 폰트 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          fc-list | grep -i nanum

      - name: 다운로드 실행
        id: download_step
        run: python 2_download.py
        continue-on-error: true

      - name: 디버그 스크린샷/HTML 업로드 (실패 원인 확인용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            downloads/debug_*.png
            downloads/debug_*.html
          if-no-files-found: ignore

      - name: 다운로드 실패 시 여기서 중단
        if: steps.download_step.outcome == 'failure'
        run: exit 1

      - name: 병합 및 시각화 실행
        run: python 3_merge_visualize.py

      - name: 결과물 커밋 (저장소에 결과 저장)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git pull --rebase
          git add downloads outputs
          git commit -m "자동 수집: $(date +'%Y-%m-%d')" || echo "변경사항 없음"
          git push
